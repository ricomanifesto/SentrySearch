name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  frontend:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:surface-coverage
      - run: npm run test:experience
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.12.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python dev/check_local_setup.py

  formal:
    name: Lean specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install elan
        run: |
          set -euo pipefail
          # Pin the release archive itself: the bootstrap script downloads another executable.
          url=https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
          # Digest from the v4.2.4 GitHub release asset metadata.
          sha256=42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
          elan_dir=$(mktemp -d "$RUNNER_TEMP/elan.XXXXXXXX")
          trap 'rm -rf "$elan_dir"' EXIT
          curl --retry 5 --retry-all-errors --proto '=https' --tlsv1.2 -sSfL "$url" -o "$elan_dir/elan.tar.gz"
          echo "$sha256  $elan_dir/elan.tar.gz" | sha256sum --check --strict
          tar -xzf "$elan_dir/elan.tar.gz" -C "$elan_dir"
          "$elan_dir/elan-init" -y --default-toolchain none --no-modify-path
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install the pinned Lean toolchain
        working-directory: formal
        run: |
          for _ in 1 2 3 4 5; do
            elan toolchain install "$(cat lean-toolchain)" && exit 0
            sleep 15
          done
          exit 1
      - name: Build and check the proofs
        working-directory: formal
        run: lake build
